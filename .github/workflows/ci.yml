name: CI

on:
  push:
    branches: [main, dev, "chatgpt/**", "feature/**", "fix/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:static
      - run: pnpm test
      - run: pnpm readiness:template
      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config >/dev/null
      - run: pnpm typecheck
      - run: pnpm build
