name: CI

on:
  push:
    branches: [main, dev, "chatgpt/**", "feature/**", "fix/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:static
      - run: pnpm test
      - run: pnpm readiness:template
      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config >/dev/null
      - run: pnpm typecheck
      - run: pnpm build

      - name: Package tracked source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SOURCE_ARCHIVE="Veylo-v${VERSION}-source.zip"
          git archive --format=zip --output="${SOURCE_ARCHIVE}" HEAD
          echo "SOURCE_ARCHIVE=${SOURCE_ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload source archive
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: veylo-source-${{ github.sha }}
          path: ${{ env.SOURCE_ARCHIVE }}
          if-no-files-found: error
          retention-days: 14
