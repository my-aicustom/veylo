name: CI

on:
  push:
    branches: [main, dev, "chatgpt/**", "feature/**", "fix/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:static
      - run: pnpm test
      - run: pnpm readiness:template
      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config >/dev/null
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm smoke:runtime

      - name: Package verified release source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SOURCE_ARCHIVE="Veylo-v${VERSION}-source.zip"
          BUILD_INFO="Veylo-v${VERSION}-BUILD_INFO.txt"
          git archive --format=zip --output="${SOURCE_ARCHIVE}" HEAD
          sha256sum "${SOURCE_ARCHIVE}" > "${SOURCE_ARCHIVE}.sha256"
          {
            echo "Veylo verified source release"
            echo "version=${VERSION}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "gates=static-audit,tests,readiness,compose,typecheck,build,runtime-smoke"
          } > "${BUILD_INFO}"
          echo "SOURCE_ARCHIVE=${SOURCE_ARCHIVE}" >> "$GITHUB_ENV"
          echo "BUILD_INFO=${BUILD_INFO}" >> "$GITHUB_ENV"

      - name: Upload verified release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: veylo-v1.0.0-${{ github.sha }}
          path: |
            ${{ env.SOURCE_ARCHIVE }}
            ${{ env.SOURCE_ARCHIVE }}.sha256
            ${{ env.BUILD_INFO }}
          if-no-files-found: error
          retention-days: 30
